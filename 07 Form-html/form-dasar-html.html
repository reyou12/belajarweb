<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form dasar html</title>
  </head>
  <body>
    <main>
      <h2>Form dasar html</h2>
      <form method=""post">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" autocomplete="off" required autofocus /> <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required /> <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required /> <br>
        <label for="angka">angka</label>
        <input type="number" name="angka" id="angka" max="1000" min="0"> <br>
        <label for="warna">warna</label>
        <input type="color" name="warna" id="warna"> <br>
        <label for="tanggal lahir">tanggal lahir</label>
        <input type="date" name="tanggal lahir" id="tanggal lahir"> <br>
        <label for="jenis kelamin">jenis kelamin :</label>
      <input type="radio" name="jenis kelamin" id="laki-laki" value="Laki-laki" checked>
      <label for="laki-laki">Laki-laki</label> 
      <input type="radio" name="jenis kelamin" id="perempuan" value="Perempuan">
      <label for="perempuan">perempuan</label> <br>
      <h5>Hobi:</h5>
      <input type="checkbox" name="Hobi1" id="hobi1" value="main bola">
      <label for="hobi1">main bola</label>
      <input type="checkbox" name="hobi2" id="hobi2" value="bulutangkis">
      <label for="hobi2">bulutangkis</label>
      <input type="checkbox" name="hobi3" id="hobi3" value="berenang">
      <label for="hobi3">berenang</label><br>

              <button type="submit">kirim</button>
        <button type="reset">reset</button>
      </form>
    </main>
  </body>
</html>
